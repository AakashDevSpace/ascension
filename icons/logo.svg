<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ascension mark: the arch alone on a transparent background. Colour flows through it: the gradient repeats every
       320 units and slides exactly one period per loop, so the loop has no seam. Both layers are strokes of the same
       path, so nothing can paint outside the arch. -->
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="320" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset=".25" stop-color="#7c3aed"/>
      <stop offset=".5" stop-color="#c4b5fd"/>
      <stop offset=".72" stop-color="#e9a8f5"/>
      <stop offset="1" stop-color="#4c1d95"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="320 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".42" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".58" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-320 0" to="320 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="168" x2="0" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".3"/>
      <stop offset=".4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <path id="a" d="M112 430 C 150 300, 196 168, 256 168 C 316 168, 362 300, 400 430" fill="none" stroke-width="86" stroke-linecap="round"/>
  </defs>
  <use href="#a" stroke="url(#flow)"/>
  <use href="#a" stroke="url(#sheen)"/>
  <use href="#a" stroke="url(#glint)"/>
</svg>
