      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset=".35" stop-color="#7c3aed"/>
      <stop offset=".7" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="160" x2="0" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".45"/>
