<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" stroke-width="86">
  <!-- Ascension mark: the arch alone on a transparent background, finished like holographic chrome.
       1. holo: pearl, pink, mint and sky tints between violet bands, sliding diagonally. The gradient repeats, and each
          loop moves it by exactly one period (its own vector), so the loop has no seam.
       2. pearl: a second, fainter white wash crossing the other way at another speed, so the tints shift like foil.
       3. rim: soft deep-violet shading at the edges (still), which rounds the arch like a polished tube.
       4. core: a soft white highlight down the middle (still).
       5. glint: a narrow light band sweeping across.
       Everything is a stroke of the same path or sits under a mask of it, so nothing paints outside the arch. -->
  <defs>
    <path id="a" d="M112 430 C 150 300, 196 168, 256 168 C 316 168, 362 300, 400 430" fill="none" stroke-linecap="round"/>

    <linearGradient id="holo" x1="0" y1="0" x2="320" y2="160" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#5b21b6"/>
      <stop offset=".13" stop-color="#7c3aed"/>
      <stop offset=".27" stop-color="#c4b5fd"/>
      <stop offset=".39" stop-color="#f5f0ff"/>
      <stop offset=".49" stop-color="#fbcfe8"/>
      <stop offset=".59" stop-color="#d5f7ee"/>
      <stop offset=".69" stop-color="#c7e3ff"/>
      <stop offset=".80" stop-color="#ede9fe"/>
      <stop offset=".90" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#5b21b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="320 160" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="pearl" x1="0" y1="0" x2="-200" y2="260" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".3" stop-color="#ffffff" stop-opacity=".38"/>
      <stop offset=".5" stop-color="#fdf2ff" stop-opacity=".1"/>
      <stop offset=".72" stop-color="#e0f2fe" stop-opacity=".3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="-200 260" dur="13s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="glint" x1="0" y1="0" x2="720" y2="240" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".44" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".7"/>
      <stop offset=".56" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="720 240" dur="5.5s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="softer" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>

    <!-- the arch itself -->
    <mask id="inside" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <use href="#a" stroke="#fff"/>
    </mask>
    <!-- its edges only: the arch, less a blurred narrower centre line -->
    <mask id="edges" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <use href="#a" stroke="#fff"/>
      <use href="#a" stroke="#000" stroke-width="50" filter="url(#soft)"/>
    </mask>
  </defs>

  <use href="#a" stroke="url(#holo)"/>
  <use href="#a" stroke="url(#pearl)"/>
  <use href="#a" stroke="#3b0764" stroke-opacity=".5" mask="url(#edges)"/>
  <g mask="url(#inside)">
    <use href="#a" stroke="#ffffff" stroke-opacity=".5" stroke-width="18" filter="url(#softer)" transform="translate(0 -9)"/>
  </g>
  <use href="#a" stroke="url(#glint)"/>
</svg>
