<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ascension mark: one smooth arch rising like an "A", with an orb floating free above the peak -->
  <defs>
    <linearGradient id="arch" x1="96" y1="0" x2="416" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f6bff"/>
      <stop offset=".38" stop-color="#7b5cff"/>
      <stop offset=".68" stop-color="#ff4f8b"/>
      <stop offset="1" stop-color="#ffb02e"/>
    </linearGradient>
    <linearGradient id="archShade" x1="0" y1="140" x2="0" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset=".45" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#ff4f8b"/>
    </radialGradient>
    <radialGradient id="orbGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <path d="M112 430 C 150 300, 196 168, 256 168 C 316 168, 362 300, 400 430" fill="none" stroke="url(#arch)" stroke-width="86" stroke-linecap="round"/>
  <path d="M112 430 C 150 300, 196 168, 256 168 C 316 168, 362 300, 400 430" fill="none" stroke="url(#archShade)" stroke-width="86" stroke-linecap="round"/>
  <circle cx="256" cy="66" r="52" fill="url(#orbGlow)"/>
  <circle cx="256" cy="66" r="30" fill="url(#orb)"/>
  <ellipse cx="247" cy="56" rx="10" ry="6" fill="#ffffff" fill-opacity=".65" transform="rotate(-25 247 56)"/>
</svg>
